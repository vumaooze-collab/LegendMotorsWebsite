services:
  php-web:
    build: ./php
    ports:
      - "8080:80"
    environment:
      AUTH_API_URL: http://python-auth:8000
    depends_on:
      - python-auth
    networks:
      - login-net

  python-auth:
    build:
      context: .
      dockerfile: python/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - login-net
    restart: unless-stopped

networks:
  login-net:
    driver: bridge
