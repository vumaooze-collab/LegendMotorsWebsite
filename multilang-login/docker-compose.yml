services:
  php-web:
    build: ./php
    ports:
      - "8080:80"
    environment:
      AUTH_API_URL: http://python-auth:8000
    depends_on:
      - python-auth
    networks:
      - login-net

  python-auth:
    build: ./python
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - cpp-risk
    networks:
      - login-net
    restart: unless-stopped

  cpp-risk:
    build: ./cpp
    networks:
      - login-net

networks:
  login-net:
    driver: bridge
