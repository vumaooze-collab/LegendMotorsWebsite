name: Verify Legend Motors

on:
  push:
    branches: ["main", "codex/legend-motors-finish"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legendmotors_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legendmotors_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/legendmotors_ci?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply schema to ephemeral CI database
        run: npx prisma db push
      - name: Run ESLint
        run: npm run lint
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build production application
        run: npm run build
      - name: Run tests
        run: npm test
