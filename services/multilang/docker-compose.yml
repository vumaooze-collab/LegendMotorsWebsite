services:
  php-api:
    build:
      context: ./php
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
    ports:
      - "${PHP_PORT:-8080}:80"
    restart: unless-stopped

  python-analytics:
    build:
      context: ./python
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
    ports:
      - "${PYTHON_PORT:-8000}:8000"
    restart: unless-stopped
