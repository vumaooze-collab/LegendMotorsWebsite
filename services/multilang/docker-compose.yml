services:
  php-api:
    build:
      context: ./php
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
    ports:
      - "127.0.0.1:${PHP_PORT:-8080}:80"
    restart: unless-stopped

  python-analytics:
    build:
      context: .
      dockerfile: python/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
    ports:
      - "127.0.0.1:${PYTHON_PORT:-8000}:8000"
    restart: unless-stopped
